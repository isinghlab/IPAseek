name: ipaseek
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # R base
  - r-base>=4.3.0

  # CRAN packages
  - r-data.table
  - r-gtools
  - r-dplyr
  - r-tidyr
  - r-tidyverse
  - r-ggplot2
  - r-scales
  - r-changepoint             # PELT changepoint detection
  - r-slurmr                  # SLURM job submission from R (was incorrectly r-slurm)

  # Bioconductor packages
  - bioconductor-genomicalignments
  - bioconductor-genomicfeatures
  - bioconductor-genomicranges
  - bioconductor-summarizedexperiment
  - bioconductor-deseq2

# ── HPC-only tools (Linux clusters only) ────────────────────────────────────
# STAR and samtools are only needed for Stage 2 (alignment).
# They are Linux-only and cannot be installed on macOS ARM (osx-arm64).
# On a Linux HPC cluster, install separately:
#
#   conda install -n ipaseek -c bioconda star>=2.7.10a samtools>=1.17
#
# Or add them back to this file when creating the env on a Linux cluster:
#
#   - star>=2.7.10a               # RNA-seq alignment (Linux only)
#   - samtools>=1.17              # BAM processing (Linux only)

# Usage:
#   conda env create -f environment.yml      # works on macOS + Linux
#   conda activate ipaseek
#
#   # On Linux HPC (for Stage 2 alignment):
#   conda install -n ipaseek -c bioconda star>=2.7.10a samtools>=1.17
