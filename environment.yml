name: ipaseek
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # R base
  - r-base>=4.3.0

  # CRAN packages (available on conda-forge)
  - r-data.table
  - r-gtools
  - r-dplyr
  - r-tidyr
  - r-tidyverse
  - r-ggplot2
  - r-scales
  - r-changepoint             # PELT changepoint detection

  # Bioconductor packages
  - bioconductor-genomicalignments
  - bioconductor-genomicfeatures
  - bioconductor-genomicranges
  - bioconductor-summarizedexperiment
  - bioconductor-deseq2

  # Post-install: run this once after activating the environment:
  #   Rscript -e 'install.packages("slurmR")'
  # slurmR is only available from CRAN, not conda.
  # It is only needed on HPC clusters for SLURM job submission (Stage 2/3).

# ── HPC-only tools (Linux clusters only) ────────────────────────────────────
# STAR and samtools are only needed for Stage 2 (alignment).
# They are Linux-only and cannot be installed on macOS ARM (osx-arm64).
# On a Linux HPC cluster, install separately after env creation:
#
#   conda install -n ipaseek -c bioconda "star>=2.7.10a" "samtools>=1.17"

# Usage:
#   conda env create -f environment.yml      # works on macOS + Linux
#   conda activate ipaseek
#
#   # Install slurmR from CRAN (HPC clusters only):
#   Rscript -e 'install.packages("slurmR")'
#
#   # On Linux HPC (for Stage 2 alignment):
#   conda install -n ipaseek -c bioconda "star>=2.7.10a" "samtools>=1.17"
